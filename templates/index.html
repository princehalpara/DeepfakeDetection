<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepfake Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell" aria-label="Deepfake detector">
    <section class="control-panel">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Face Origin Lab</span>
      </div>

      <h1>Deepfake Face Detector</h1>
      <p class="sub">Upload one clear face image and run the detector.</p>

      <label class="upload-zone" id="dropZone" for="fileInput">
        <input type="file" id="fileInput" accept="image/*">
        <span class="upload-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="M12 16V4m0 0 4.5 4.5M12 4 7.5 8.5M5 16.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5"/>
          </svg>
        </span>
        <span class="upload-title">Select Image</span>
        <span class="file-name" id="fileName">No image selected</span>
      </label>

      <button id="checkBtn" disabled>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="M4 12h16M12 4v16M7 7l10 10M17 7 7 17"/>
          </svg>
        </span>
        <span>Check Image</span>
      </button>

      <div id="result" hidden></div>
    </section>

    <section class="visual-panel" aria-label="Image preview">
      <div class="scanner-stage" aria-hidden="true">
        <div class="depth-plane plane-back"></div>
        <div class="depth-plane plane-mid"></div>
        <div class="image-plane">
          <img id="preview" alt="Selected preview" hidden>
          <div class="empty-preview" id="emptyPreview">
            <span class="face-line brow"></span>
            <span class="face-line eye left-eye"></span>
            <span class="face-line eye right-eye"></span>
            <span class="face-line nose"></span>
            <span class="face-line mouth"></span>
          </div>
          <span class="scan-line"></span>
        </div>
      </div>
      <div class="meter-strip" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
